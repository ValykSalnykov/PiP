<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>DAO Tools+ Screen Capture</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
    }

    main {
      width: min(520px, calc(100vw - 48px));
      padding: 24px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.14);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 12px;
      color: #334155;
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: #ea580c;
      color: #fff;
      cursor: pointer;
      font: 700 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button:hover:not(:disabled) {
      background: #c2410c;
    }

    button:disabled {
      cursor: default;
      opacity: 0.65;
    }

    #status {
      min-height: 20px;
      margin-top: 12px;
      color: #7c2d12;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Скріншот для HelpDesk</h1>
    <p>Натисніть кнопку нижче та у вікні Chrome оберіть весь екран. Після вибору розширення автоматично поверне вкладку з таблицею та зробить скріншот.</p>
    <button id="capture-button" type="button">Обрати екран</button>
    <p id="status"></p>
  </main>
  <script src="desktop-capture.js"></script>
</body>
</html>
