<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Planfix → Syrve</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 360px;
      max-width: 360px;
      padding: 10px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
      overflow-y: auto;
    }

    .popup {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 10px;
      box-shadow: 0 16px 28px rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.1);
    }

    .popup__main {
      display: grid;
      gap: 10px;
    }

    .is-hidden {
      display: none !important;
    }

    .popup__header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .popup__title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .popup__title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .disco-ball {
      width: 20px;
      height: 20px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .disco-ball:hover {
      transform: scale(1.1);
    }

    .disco-ball::before {
      content: "🪩";
      font-size: 20px;
      display: block;
    }

    .disco-ball.active {
      animation: disco-glow 1.5s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 0, 128, 0.8)) drop-shadow(0 0 12px rgba(64, 224, 208, 0.6));
    }

    @keyframes disco-glow {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(255, 0, 128, 0.8)) drop-shadow(0 0 12px rgba(64, 224, 208, 0.6));
      }
      50% {
        filter: drop-shadow(0 0 15px rgba(255, 140, 0, 1)) drop-shadow(0 0 20px rgba(64, 224, 208, 0.9));
      }
    }

    .popup__status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 0.75rem;
      color: #4338ca;
      max-width: 100%;
    }

    .popup__status.is-hidden {
      display: none;
    }

    .popup__client-id-label {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
    }

    .popup__client-id-value {
      font-weight: 700;
      color: #4f46e5;
      background: rgba(79, 70, 229, 0.12);
      padding: 4px 8px;
      border-radius: 999px;
      overflow-wrap: anywhere;
    }

    .popup__link-button {
      background: none;
      border: none;
      color: #4338ca;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .popup__link-button:hover {
      color: #312e81;
    }

    .card {
      display: grid;
      gap: 8px;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid rgba(79, 70, 229, 0.12);
      padding: 10px;
      background: rgba(255, 255, 255, 0.92);
    }

    .card--hero {
      background:
        radial-gradient(circle at top right, rgba(191, 219, 254, 0.9), transparent 42%),
        linear-gradient(160deg, rgba(238, 242, 255, 0.92), rgba(255, 255, 255, 0.98));
      border-color: rgba(59, 130, 246, 0.18);
    }

    .card--collapsed {
      display: none;
    }

    .card__title {
      margin: 0;
      font-size: 0.84rem;
      font-weight: 600;
      color: #4f46e5;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    .field label {
      font-size: 0.74rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input {
      min-width: 0;
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(17, 24, 39, 0.18);
      font-size: 0.88rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #ffffff;
    }

    .field input:focus {
      border-color: #4f46e5;
      outline: none;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .field input[type="color"] {
      min-height: 38px;
      padding: 4px;
      cursor: pointer;
    }

    .field input[type="color"]:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      background: #f3f4f6;
    }

    .field__note {
      margin: 0;
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.45;
    }

    .highlight-settings {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(79, 70, 229, 0.12);
      background: rgba(79, 70, 229, 0.04);
    }

    .highlight-settings--disabled {
      border-color: rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.08);
    }

    .highlight-settings__toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .highlight-settings__copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .highlight-settings__title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #111827;
      line-height: 1.35;
    }

    .highlight-settings__hint {
      font-size: 0.72rem;
      color: #6b7280;
      line-height: 1.4;
    }

    .highlight-settings__toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #4f46e5;
    }

    .collapsible-card {
      gap: 0;
      padding: 0;
      overflow: hidden;
    }

    .collapsible-card[open] {
      padding-bottom: 10px;
    }

    .collapsible-card__summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      padding: 10px;
      user-select: none;
    }

    .collapsible-card__summary::-webkit-details-marker {
      display: none;
    }

    .collapsible-card__summary:hover {
      background: rgba(79, 70, 229, 0.04);
    }

    .collapsible-card__chevron {
      width: 10px;
      height: 10px;
      border-right: 2px solid #6b7280;
      border-bottom: 2px solid #6b7280;
      transform: rotate(45deg);
      transition: transform 0.15s ease;
      flex-shrink: 0;
      margin-right: 4px;
    }

    .collapsible-card[open] .collapsible-card__chevron {
      transform: rotate(225deg);
      margin-top: 4px;
    }

    .collapsible-card__body {
      display: grid;
      gap: 8px;
      padding: 0 10px;
    }

    .fields-inline {
      display: grid;
      gap: 8px;
    }

    .button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.35;
      text-align: center;
      white-space: normal;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.18);
    }

    .button:hover {
      background: #4338ca;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(67, 56, 202, 0.2);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: 0 6px 12px rgba(67, 56, 202, 0.16);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      box-shadow: none;
    }

    .button--secondary {
      background: rgba(79, 70, 229, 0.12);
      color: #4338ca;
      box-shadow: none;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .button--secondary:hover {
      background: rgba(79, 70, 229, 0.2);
    }

    .card__actions {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .card__lead {
      margin: 0;
      font-size: 0.84rem;
      line-height: 1.45;
      color: #1f2937;
    }

    .card__divider {
      border: none;
      border-top: 1px solid rgba(79, 70, 229, 0.12);
      margin: 2px 0;
    }

    .card__sub-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .button--grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .button--success {
      background: #059669;
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(5, 150, 105, 0.18);
    }

    .button--success:hover {
      background: #047857;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(4, 120, 87, 0.2);
    }

    .button--warning {
      background: #d97706;
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(217, 119, 6, 0.18);
    }

    .button--warning:hover {
      background: #b45309;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(180, 83, 9, 0.2);
    }

    .popup__hero-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-pill--neutral {
      background: rgba(71, 85, 105, 0.12);
      color: #334155;
    }

    .status-pill--warning {
      background: rgba(217, 119, 6, 0.12);
      color: #92400e;
    }

    .status-pill--success {
      background: rgba(5, 150, 105, 0.12);
      color: #065f46;
    }

    .status-box {
      display: grid;
      gap: 4px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(71, 85, 105, 0.16);
      background: rgba(248, 250, 252, 0.96);
      color: #0f172a;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-box--neutral {
      background: rgba(241, 245, 249, 0.92);
      border-color: rgba(148, 163, 184, 0.28);
      color: #334155;
    }

    .status-box--warning {
      background: rgba(255, 247, 237, 0.96);
      border-color: rgba(251, 146, 60, 0.28);
      color: #9a3412;
    }

    .status-box--success {
      background: rgba(236, 253, 245, 0.96);
      border-color: rgba(16, 185, 129, 0.24);
      color: #065f46;
    }

    .status-box--error {
      background: rgba(254, 242, 242, 0.96);
      border-color: rgba(248, 113, 113, 0.26);
      color: #991b1b;
    }

    .status-box__title,
    .status-box__text {
      margin: 0;
    }

    .status-box__title {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-box__text {
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .readonly-box {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px dashed rgba(79, 70, 229, 0.28);
      background: rgba(238, 242, 255, 0.96);
      color: #312e81;
      font-size: 0.78rem;
      font-weight: 600;
      word-break: break-all;
    }

    #modeInfo {
      margin: 0;
      font-size: 0.84rem;
      color: #111827;
      font-weight: 500;
    }

    #errorMessage {
      margin: 0;
      font-size: 0.78rem;
      color: #dc2626;
      white-space: pre-wrap;
      background: rgba(220, 38, 38, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(220, 38, 38, 0.18);
    }

    #errorMessage:empty {
      display: none;
    }

    .inline-server-error {
      display: none;
      margin: 0;
      font-size: 0.78rem;
      color: #dc2626;
      white-space: pre-wrap;
      background: rgba(220, 38, 38, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(220, 38, 38, 0.18);
    }

    .inline-server-error.is-visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="popup">
    <header class="popup__header">
      <div class="popup__title-wrapper">
        <div class="disco-ball" id="discoBall" title="Toggle Disco Mode"></div>
        <h1 class="popup__title">DAO Tools+</h1>
      </div>
      <div class="popup__status is-hidden" id="clientStatus">
        <span class="popup__client-id-label">User ID</span>
        <span class="popup__client-id-value" id="clientIdBadge"></span>
        <button class="popup__link-button" id="editClientBtn" type="button">Змінити</button>
      </div>
    </header>

    <section class="card card--hero" aria-labelledby="device-access" id="accessSetupCard">
      <div class="popup__hero-header">
        <h2 id="device-access" class="card__title">Персональний доступ</h2>
        <span id="accessStatusBadge" class="status-pill status-pill--warning">Налаштування</span>
      </div>
      <p id="accessIntro" class="card__lead">Щоб працювати з розширенням, пристрій має пройти ручне схвалення.</p>
      <div id="accessStatusBox" class="status-box status-box--neutral">
        <p id="accessStatusTitle" class="status-box__title">Спочатку збережіть User ID</p>
        <p id="accessHelpText" class="status-box__text is-hidden"></p>
      </div>
      <div class="field">
        <label for="inputField">User ID</label>
        <input type="text" id="inputField" placeholder="Введіть User ID" autocomplete="off">
      </div>
      <button id="saveButton" class="button button--secondary" type="button">Зберегти User ID</button>
      <hr class="card__divider">
      <div class="card__actions">
        <button id="requestAccessButton" class="button" type="button">Запросити доступ до пристрою</button>
        <div class="field is-hidden" id="claimFieldGroup">
          <label for="claimCodeInput">Код підтвердження</label>
          <input type="text" id="claimCodeInput" placeholder="ABCD-EFGH-JKLM" autocomplete="off">
        </div>
        <button id="claimAccessButton" class="button button--success is-hidden" type="button">Активувати доступ</button>
        <button id="cancelAccessSetupButton" class="button button--secondary is-hidden" type="button">Повернутися до інструментів</button>
      </div>
      <div id="accessMessage" class="status-box status-box--neutral is-hidden" aria-live="polite"></div>
    </section>

    <div id="mainContent" class="popup__main is-hidden">
      <section class="card" aria-labelledby="one-time">
        <h2 id="one-time" class="card__title">Ручне відкриття сервера</h2>
        <div class="fields-inline">
          <div class="field">
            <label for="serverField">Сервер</label>
            <input type="text" id="serverField" placeholder="Адрес сервера">
          </div>
          <div class="field">
            <label for="portField">Порт</label>
            <input type="text" id="portField" placeholder="Номер порта">
          </div>
        </div>
        <button id="sendDataButton" class="button">Відкрити Backoffice / Chain</button>
        <div id="inlineServerError" class="inline-server-error" aria-live="polite"></div>
      </section>

      <section class="card" aria-labelledby="mode-management">
        <h2 id="mode-management" class="card__title">Режим</h2>
        <p id="modeInfo">Завантаження даних...</p>
        <button id="toggleModeButton" class="button button--secondary">Переключити режим</button>
      </section>

      <section class="card" aria-labelledby="error-info">
        <h2 id="error-info" class="card__title">Помилки</h2>
        <div class="card__actions">
          <button id="showErrorButton" class="button button--secondary">Показати останню помилку</button>
          <div id="errorMessage"></div>
        </div>
      </section>

      <details class="card collapsible-card" aria-labelledby="pip-settings-title">
        <summary class="collapsible-card__summary">
          <h2 id="pip-settings-title" class="card__title">Налаштування PiP вікна</h2>
          <span class="collapsible-card__chevron" aria-hidden="true"></span>
        </summary>
        <div class="collapsible-card__body">
          <div id="taskHighlightSettings" class="highlight-settings highlight-settings--disabled">
            <label class="highlight-settings__toggle" for="taskOverdueBlinkToggle">
              <span class="highlight-settings__copy">
                <span class="highlight-settings__title">Індикація прострочених задач</span>
              </span>
              <input id="taskOverdueBlinkToggle" type="checkbox">
            </label>
            <label class="highlight-settings__toggle" for="taskHighlightToggle">
              <span class="highlight-settings__copy">
                <span class="highlight-settings__title">Індикація нових задач у PiP</span>
              </span>
              <input id="taskHighlightToggle" type="checkbox">
            </label>
            <div class="field">
              <label for="taskHighlightColor">Колір індикації</label>
              <input id="taskHighlightColor" type="color" value="#2fd212" disabled>
            </div>
          </div>
        </div>
      </details>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
